<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <h:form id="frmZone">

        <div class="gs-page__head">
            <span class="ui-input-icon-left">
                <i class="pi pi-search"></i>
                <p:inputText value="#{geographieBean.filtreZone}" placeholder="#{msg['action.rechercher']}">
                    <p:ajax event="keyup" update=":geoTabs:frmZone:tbl" delay="350"/>
                </p:inputText>
            </span>
            <span class="gs-spacer"></span>
            <p:commandButton value="#{msg['action.nouveau']}" icon="pi pi-plus" process="@this"
                             rendered="#{utilisateurCourant.autorise(perms.GEO_CREER)}"
                             action="#{geographieBean.nouvelleZone}" update=":geoTabs:frmZone:dlgZone"
                             oncomplete="PF('dlgZone').show()"/>
            <p:commandButton icon="pi pi-download" value="CSV" ajax="false"
                             rendered="#{utilisateurCourant.autorise(perms.GEO_EXPORTER)}">
                <p:dataExporter type="csv" target="tbl" fileName="zones"/>
            </p:commandButton>
        </div>

        <p:dataTable id="tbl" var="row" value="#{geographieBean.zones}" lazy="true"
                     paginator="true" paginatorPosition="bottom" rows="10" rowsPerPageTemplate="10,25,50"
                     paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     emptyMessage="#{msg['common.aucuneDonnee']}" styleClass="gs-card">
            <p:column headerText="#{msg['geo.f.code']}" sortBy="#{row.code}" style="width:7rem">#{row.code}</p:column>
            <p:column headerText="#{msg['geo.f.libelle']}" sortBy="#{row.libelle}">#{row.libelle}</p:column>
            <p:column headerText="#{msg['geo.f.continent']}">#{row.continentLibelle}</p:column>
            <p:column headerText="#{msg['geo.f.pays']}" style="width:6rem">#{row.nbPays}</p:column>
            <p:column headerText="#{msg['common.etat']}" sortBy="#{row.etat}" style="width:8rem">
                <p:tag value="#{row.etat ? msg['common.actif'] : msg['common.inactif']}"
                       severity="#{row.etat ? 'success' : 'danger'}"/>
            </p:column>
            <p:column headerText="#{msg['common.actions']}" style="width:8rem" exportable="false">
                <span class="gs-actions">
                    <p:commandButton icon="pi pi-pencil" title="#{msg['action.editer']}" process="@this"
                                     rendered="#{utilisateurCourant.autorise(perms.GEO_MODIFIER)}"
                                     action="#{geographieBean.editerZone(row)}" update=":geoTabs:frmZone:dlgZone"
                                     oncomplete="PF('dlgZone').show()" styleClass="ui-button-flat"/>
                    <p:commandButton icon="#{row.etat ? 'pi pi-ban' : 'pi pi-check'}" process="@this"
                                     title="#{row.etat ? msg['action.desactiver'] : msg['action.activer']}"
                                     rendered="#{utilisateurCourant.autorise(perms.GEO_SUPPRIMER)}"
                                     action="#{geographieBean.basculerZone(row)}"
                                     update=":geoTabs:frmZone:tbl :growl" styleClass="ui-button-flat">
                        <p:confirm header="#{msg['action.confirmer']}" message="#{msg['common.confirmToggle']}"
                                   icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>
                </span>
            </p:column>
        </p:dataTable>

        <p:dialog id="dlgZone" widgetVar="dlgZone" modal="true" resizable="false" width="560" responsive="true"
                  header="#{empty geographieBean.zone.id ? msg['geo.zone.nouveau'] : msg['geo.zone.edition']}">
            <p:messages showDetail="true" closable="true"/>
            <div class="gs-form-grid">
                <div class="gs-field-v gs-col-2">
                    <label>#{msg['geo.f.continent']}</label>
                    <p:selectOneMenu value="#{geographieBean.zone.continentId}" required="true"
                                     filter="true" filterMatchMode="contains">
                        <f:selectItem itemLabel="—" itemValue="#{null}"/>
                        <f:selectItems value="#{geographieBean.refContinents}" var="c"
                                       itemLabel="#{c.libelle}" itemValue="#{c.id}"/>
                    </p:selectOneMenu>
                </div>
                <div class="gs-field-v gs-col-2">
                    <label>#{msg['geo.f.libelle']}</label>
                    <p:inputText value="#{geographieBean.zone.libelle}" required="true" maxlength="80"/>
                </div>
                <div class="gs-field-v">
                    <label>#{msg['geo.f.code']}</label>
                    <p:inputText value="#{geographieBean.zone.code}" maxlength="10"/>
                </div>
                <div class="gs-field-v gs-col-2">
                    <label>#{msg['geo.f.description']}</label>
                    <p:inputText value="#{geographieBean.zone.description}" maxlength="255"/>
                </div>
            </div>
            <f:facet name="footer">
                <p:commandButton value="#{msg['action.annuler']}" type="button" styleClass="ui-button-flat"
                                 onclick="PF('dlgZone').hide()"/>
                <p:commandButton value="#{msg['action.enregistrer']}" icon="pi pi-check"
                                 action="#{geographieBean.enregistrerZone}" process=":geoTabs:frmZone:dlgZone"
                                 update=":geoTabs:frmZone:tbl :geoTabs:frmZone:dlgZone :growl"
                                 oncomplete="if (args &amp;&amp; args.ok) PF('dlgZone').hide()"/>
            </f:facet>
        </p:dialog>
    </h:form>
</ui:composition>
