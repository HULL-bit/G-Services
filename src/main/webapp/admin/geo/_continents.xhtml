<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <h:form id="frmCont">

        <div class="gs-page__head">
            <span class="ui-input-icon-left">
                <i class="pi pi-search"></i>
                <p:inputText value="#{geographieBean.filtreContinent}" placeholder="#{msg['action.rechercher']}">
                    <p:ajax event="keyup" update=":geoTabs:frmCont:tbl" delay="350"/>
                </p:inputText>
            </span>
            <span class="gs-spacer"></span>
            <p:commandButton value="#{msg['action.nouveau']}" icon="pi pi-plus" process="@this"
                             rendered="#{utilisateurCourant.autorise(perms.GEO_CREER)}"
                             action="#{geographieBean.nouveauContinent}" update=":geoTabs:frmCont:dlgContinent"
                             oncomplete="PF('dlgContinent').show()"/>
            <p:commandButton icon="pi pi-download" value="CSV" ajax="false"
                             rendered="#{utilisateurCourant.autorise(perms.GEO_EXPORTER)}">
                <p:dataExporter type="csv" target="tbl" fileName="continents"/>
            </p:commandButton>
        </div>

        <p:dataTable id="tbl" var="row" value="#{geographieBean.continents}" lazy="true"
                     paginator="true" paginatorPosition="bottom" rows="10" rowsPerPageTemplate="10,25,50"
                     paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     emptyMessage="#{msg['common.aucuneDonnee']}" styleClass="gs-card">
            <p:column headerText="#{msg['geo.f.code']}" sortBy="#{row.code}" style="width:7rem">#{row.code}</p:column>
            <p:column headerText="#{msg['geo.f.libelle']}" sortBy="#{row.libelle}">#{row.libelle}</p:column>
            <p:column headerText="#{msg['geo.f.superficie']}" style="width:11rem">
                <h:outputText value="#{row.superficieKm2}">
                    <f:convertNumber type="number" maxFractionDigits="0"/>
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg['geo.f.population']}" style="width:11rem">
                <h:outputText value="#{row.population}"><f:convertNumber type="number"/></h:outputText>
            </p:column>
            <p:column headerText="#{msg['geo.f.zones']}" style="width:6rem">#{row.nbZones}</p:column>
            <p:column headerText="#{msg['common.etat']}" sortBy="#{row.etat}" style="width:8rem">
                <p:tag value="#{row.etat ? msg['common.actif'] : msg['common.inactif']}"
                       severity="#{row.etat ? 'success' : 'danger'}"/>
            </p:column>
            <p:column headerText="#{msg['common.actions']}" style="width:8rem" exportable="false">
                <span class="gs-actions">
                    <p:commandButton icon="pi pi-pencil" title="#{msg['action.editer']}" process="@this"
                                     rendered="#{utilisateurCourant.autorise(perms.GEO_MODIFIER)}"
                                     action="#{geographieBean.editerContinent(row)}" update=":geoTabs:frmCont:dlgContinent"
                                     oncomplete="PF('dlgContinent').show()" styleClass="ui-button-flat"/>
                    <p:commandButton icon="#{row.etat ? 'pi pi-ban' : 'pi pi-check'}" process="@this"
                                     title="#{row.etat ? msg['action.desactiver'] : msg['action.activer']}"
                                     rendered="#{utilisateurCourant.autorise(perms.GEO_SUPPRIMER)}"
                                     action="#{geographieBean.basculerContinent(row)}"
                                     update=":geoTabs:frmCont:tbl :growl" styleClass="ui-button-flat">
                        <p:confirm header="#{msg['action.confirmer']}" message="#{msg['common.confirmToggle']}"
                                   icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>
                </span>
            </p:column>
        </p:dataTable>

        <p:dialog id="dlgContinent" widgetVar="dlgContinent" modal="true" resizable="false" width="560" responsive="true"
                  header="#{empty geographieBean.continent.id ? msg['geo.continent.nouveau'] : msg['geo.continent.edition']}">
            <p:messages showDetail="true" closable="true"/>
            <div class="gs-form-grid">
                <div class="gs-field-v gs-col-2">
                    <label>#{msg['geo.f.libelle']}</label>
                    <p:inputText value="#{geographieBean.continent.libelle}" required="true" maxlength="80"/>
                </div>
                <div class="gs-field-v">
                    <label>#{msg['geo.f.code']}</label>
                    <p:inputText value="#{geographieBean.continent.code}" maxlength="10" placeholder="AF, EU…"/>
                </div>
                <div class="gs-field-v">
                    <label>#{msg['geo.f.superficie']} (km²)</label>
                    <p:inputNumber value="#{geographieBean.continent.superficieKm2}" decimalPlaces="0" minValue="0"/>
                </div>
                <div class="gs-field-v">
                    <label>#{msg['geo.f.population']}</label>
                    <p:inputNumber value="#{geographieBean.continent.population}" decimalPlaces="0" minValue="0"/>
                </div>
            </div>
            <f:facet name="footer">
                <p:commandButton value="#{msg['action.annuler']}" type="button" styleClass="ui-button-flat"
                                 onclick="PF('dlgContinent').hide()"/>
                <p:commandButton value="#{msg['action.enregistrer']}" icon="pi pi-check"
                                 action="#{geographieBean.enregistrerContinent}" process=":geoTabs:frmCont:dlgContinent"
                                 update=":geoTabs:frmCont:tbl :geoTabs:frmCont:dlgContinent :growl"
                                 oncomplete="if (args &amp;&amp; args.ok) PF('dlgContinent').hide()"/>
            </f:facet>
        </p:dialog>
    </h:form>
</ui:composition>
