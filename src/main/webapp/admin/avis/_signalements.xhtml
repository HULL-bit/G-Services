<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <h:form id="frmSig">
        <div class="gs-page__head">
            <span class="ui-input-icon-left">
                <i class="pi pi-search"></i>
                <p:inputText value="#{signalementBean.filtre}" placeholder="#{msg['action.rechercher']}">
                    <p:ajax event="keyup" update="tbl" delay="350"/>
                </p:inputText>
            </span>
            <p:selectOneButton value="#{signalementBean.statut}">
                <f:selectItem itemLabel="#{msg['signalement.statut.NOUVEAU']}" itemValue="NOUVEAU"/>
                <f:selectItem itemLabel="#{msg['signalement.statut.TRAITE']}" itemValue="TRAITE"/>
                <f:selectItem itemLabel="#{msg['signalement.statut.REJETE']}" itemValue="REJETE"/>
                <f:selectItem itemLabel="#{msg['signalement.etat.tous']}" itemValue="#{null}"/>
                <p:ajax update="tbl"/>
            </p:selectOneButton>
            <span class="gs-spacer"></span>
            <p:tag value="#{signalementBean.nombreNouveaux} #{msg['signalement.enAttente']}" severity="warning"
                   icon="pi pi-flag" rendered="#{signalementBean.nombreNouveaux gt 0}"/>
        </div>

        <p:dataTable id="tbl" var="s" value="#{signalementBean.model}" lazy="true"
                     paginator="true" paginatorPosition="bottom" rows="10" rowsPerPageTemplate="10,25,50"
                     paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     emptyMessage="#{msg['common.aucuneDonnee']}" styleClass="gs-card">
            <p:column headerText="#{msg['signalement.f.service']}">
                <span style="color:var(--gs-text-soft)">#{s.categorieLibelle} › </span>#{s.serviceLibelle}
                <p:tag value="#{msg['sanction.statut.active']}" severity="danger" style="margin-left:6px"
                       rendered="#{s.serviceBloque}"/>
            </p:column>
            <p:column headerText="#{msg['signalement.f.motif']}" style="width:12rem">
                #{msg['vitrine.signaler.motif.'.concat(s.motif)]}
            </p:column>
            <p:column headerText="#{msg['signalement.f.rapporteur']}" style="width:10rem">#{s.personneNom}</p:column>
            <p:column headerText="#{msg['signalement.f.description']}" style="max-width:20rem">
                <div style="white-space:normal">#{s.description}</div>
            </p:column>
            <p:column headerText="#{msg['signalement.f.date']}" style="width:8rem">
                <h:outputText value="#{s.date}"><f:convertDateTime type="localDate" pattern="dd/MM/yyyy"/></h:outputText>
            </p:column>
            <p:column headerText="#{msg['signalement.f.statut']}" style="width:8rem">
                <p:tag value="#{msg['signalement.statut.'.concat(s.statut)]}"
                       severity="#{s.statut eq 'NOUVEAU' ? 'warning' : (s.statut eq 'TRAITE' ? 'danger' : 'secondary')}"/>
            </p:column>
            <p:column headerText="#{msg['common.actions']}" style="width:11rem" exportable="false">
                <span class="gs-actions">
                    <p:commandButton icon="pi pi-ban" title="#{msg['signalement.sanctionner']}" process="@this"
                                     rendered="#{utilisateurCourant.autorise(perms.SIGNALEMENT_GERER) and s.statut eq 'NOUVEAU'}"
                                     action="#{signalementBean.preparerSanction(s)}" update=":modTabs:frmSig:dlgSanction"
                                     oncomplete="PF('dlgSanction').show()" styleClass="ui-button-flat"/>
                    <p:commandButton icon="pi pi-times" title="#{msg['signalement.rejeter']}" process="@this"
                                     rendered="#{utilisateurCourant.autorise(perms.SIGNALEMENT_GERER) and s.statut eq 'NOUVEAU'}"
                                     action="#{signalementBean.rejeter(s)}" update=":modTabs:frmSig:tbl :growl" styleClass="ui-button-flat">
                        <p:confirm header="#{msg['action.confirmer']}" message="#{msg['signalement.rejeter.confirm']}"
                                   icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>
                </span>
            </p:column>
        </p:dataTable>

        <p:dialog id="dlgSanction" widgetVar="dlgSanction" modal="true" resizable="false" width="480" responsive="true"
                  header="#{msg['signalement.sanctionner.titre']}">
            <p:messages showDetail="true" closable="true"/>
            <p class="gs-hint" style="margin:0 0 12px">
                #{signalementBean.selection.serviceLibelle} — #{msg['signalement.sanctionner.aide']}
            </p>
            <div class="gs-field-v">
                <label>#{msg['signalement.sanctionner.motif']}</label>
                <p:inputTextarea value="#{signalementBean.motifSanction}" rows="3" maxlength="500"
                                 style="width:100%" autoResize="false"/>
            </div>
            <f:facet name="footer">
                <p:commandButton value="#{msg['action.annuler']}" type="button" styleClass="ui-button-flat"
                                 onclick="PF('dlgSanction').hide()"/>
                <p:commandButton value="#{msg['signalement.sanctionner.confirmer']}" icon="pi pi-ban"
                                 action="#{signalementBean.confirmerSanction}" process=":modTabs:frmSig:dlgSanction"
                                 update=":modTabs:frmSig:tbl :modTabs:frmSig:dlgSanction :growl"
                                 oncomplete="if (args &amp;&amp; args.ok) PF('dlgSanction').hide()"/>
            </f:facet>
        </p:dialog>
    </h:form>
</ui:composition>
