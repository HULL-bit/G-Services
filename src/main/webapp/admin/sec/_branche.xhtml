<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <h:form id="frmB">

            <div class="gs-page__head">
                <span class="ui-input-icon-left">
                    <i class="pi pi-search"></i>
                    <p:inputText value="#{brancheBean.filtre}" placeholder="#{msg['action.rechercher']}">
                        <p:ajax event="keyup" update=":secTabs:frmB:tbl" delay="350"/>
                    </p:inputText>
                </span>
                <span class="gs-spacer"></span>
                <p:commandButton value="#{msg['action.nouveau']}" icon="pi pi-plus" process="@this"
                                 rendered="#{utilisateurCourant.autorise(perms.BRANCHE_CREER)}"
                                 action="#{brancheBean.preparerCreation}" update=":secTabs:frmB:dlgBranche"
                                 oncomplete="PF('dlgBranche').show()"/>
                <p:commandButton icon="pi pi-download" value="CSV" ajax="false"
                                 rendered="#{utilisateurCourant.autorise(perms.BRANCHE_EXPORTER)}">
                    <p:dataExporter type="csv" target="tbl" fileName="branches"/>
                </p:commandButton>
            </div>

            <p:dataTable id="tbl" widgetVar="tblB" var="row" value="#{brancheBean.model}" lazy="true"
                         paginator="true" paginatorPosition="bottom" rows="10" rowsPerPageTemplate="10,25,50"
                         paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                         emptyMessage="#{msg['common.aucuneDonnee']}" styleClass="gs-card">
                <p:column headerText="#{msg['branche.niveau']}" sortBy="#{row.niveau}" style="width:6rem">#{row.niveau}</p:column>
                <p:column headerText="#{msg['branche.code']}" sortBy="#{row.code}">#{row.code}</p:column>
                <p:column headerText="#{msg['branche.libelle']}" sortBy="#{row.libelle}">
                    <i class="#{row.icone}" style="margin-right:8px"></i>#{row.libelle}
                </p:column>
                <p:column headerText="#{msg['branche.nbPermissions']}" style="width:8rem">#{row.nbPermissions}</p:column>
                <p:column headerText="#{msg['common.etat']}" sortBy="#{row.etat}" style="width:9rem">
                    <p:tag value="#{row.etat ? msg['common.actif'] : msg['common.inactif']}"
                           severity="#{row.etat ? 'success' : 'danger'}"/>
                </p:column>
                <p:column headerText="#{msg['common.actions']}" style="width:8rem" exportable="false">
                    <span class="gs-actions">
                        <p:commandButton icon="pi pi-pencil" title="#{msg['action.editer']}" process="@this"
                                         rendered="#{utilisateurCourant.autorise(perms.BRANCHE_MODIFIER)}"
                                         action="#{brancheBean.preparerEdition(row)}" update=":secTabs:frmB:dlgBranche"
                                         oncomplete="PF('dlgBranche').show()" styleClass="ui-button-flat"/>
                        <p:commandButton icon="#{row.etat ? 'pi pi-ban' : 'pi pi-check'}" process="@this"
                                         title="#{row.etat ? msg['action.desactiver'] : msg['action.activer']}"
                                         rendered="#{utilisateurCourant.autorise(perms.BRANCHE_SUPPRIMER)}"
                                         action="#{brancheBean.basculerEtat(row)}" update=":secTabs:frmB:tbl :growl"
                                         styleClass="ui-button-flat">
                            <p:confirm header="#{msg['action.confirmer']}" message="#{msg['common.confirmToggle']}"
                                       icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>
                    </span>
                </p:column>
            </p:dataTable>
        

        
            <p:dialog id="dlgBranche" widgetVar="dlgBranche" modal="true" resizable="false" width="600" responsive="true"
                      header="#{empty brancheBean.selection.id ? msg['branche.dialogNouveau'] : msg['branche.dialogEdition']}">
                <p:messages showDetail="true" closable="true"/>
                <div class="gs-form-grid">
                    <div class="gs-field-v">
                        <label>#{msg['branche.code']} <small class="gs-hint">(#{msg['common.auto']})</small></label>
                        <p:inputText value="#{brancheBean.selection.code}" disabled="true"
                                     placeholder="1000, 2000, 3000…"/>
                    </div>
                    <div class="gs-field-v">
                        <label>#{msg['branche.niveau']}</label>
                        <p:spinner value="#{brancheBean.selection.niveau}" min="0" stepFactor="1" size="5"/>
                    </div>
                    <div class="gs-field-v gs-col-2">
                        <label>#{msg['branche.libelle']}</label>
                        <p:inputText value="#{brancheBean.selection.libelle}" required="true" maxlength="100"/>
                    </div>
                    <div class="gs-field-v">
                        <label>#{msg['branche.icone']}</label>
                        <p:inputText value="#{brancheBean.selection.icone}" maxlength="60" placeholder="pi pi-..."/>
                    </div>
                    <div class="gs-field-v">
                        <label>#{msg['branche.reference']}</label>
                        <p:inputText value="#{brancheBean.selection.reference}" maxlength="150"/>
                    </div>
                </div>
                <f:facet name="footer">
                    <p:commandButton value="#{msg['action.annuler']}" type="button" styleClass="ui-button-flat"
                                     onclick="PF('dlgBranche').hide()"/>
                    <p:commandButton value="#{msg['action.enregistrer']}" icon="pi pi-check"
                                     action="#{brancheBean.enregistrer}"
                                     update=":secTabs:frmB:tbl :secTabs:frmB:dlgBranche :growl"
                                     oncomplete="if (args &amp;&amp; args.ok) PF('dlgBranche').hide()" process=":secTabs:frmB:dlgBranche"/>
                </f:facet>
            </p:dialog>
        
    </h:form>
</ui:composition>
